# Builds the Godot web export and publishes it to GitHub Pages
# on every push to main, so the browser version is always the latest.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-android-windows

      - name: Install Godot and web templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSfL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j tpl.tpz 'templates/web_nothreads_*' 'templates/android_*' 'templates/windows_release_x86_64.exe' 'templates/version.txt' -d "$dest"
          rm tpl.tpz

      # Code pack + art pack + music on demand + gzipped engine, and the loading page that ties
      # them together: see tools/web/build_web.sh and docs/web_load.md.
      - name: Export web build
        run: |
          set -o pipefail
          ~/godot/godot --headless --import || true
          GODOT=~/godot/godot tools/web/build_web.sh | tee build_web.log | grep -v "savepack\|Storing File"
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          echo "{\"version\": \"$version\"}" > build/web/version.json    # (the programs' new-version box: scripts/update_check.gd)
          echo "Built version $version ($(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; sed -n '/^web build:/,$p' build_web.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The same game as an Android app, published next to the web build as Holdfast.apk.
      # (If this step fails the web build still goes out.)
      - name: Export Android app
        continue-on-error: true
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tools/android/pocketrts.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: pocketrts
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: pocketrts
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          IFS=. read -r ma mi pa <<< "$version"
          sed -i "s/^version\/code=.*/version\/code=$((ma*10000 + mi*100 + pa))/; s/^version\/name=.*/version\/name=\"$version\"/" export_presets.cfg
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          for f in ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-${GODOT_VERSION}.tres; do
            mkdir -p ~/.config/godot
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$sdk" "$JAVA_HOME_17_X64" > "$f"
          done
          ~/godot/godot --headless --export-release "Android" build/web/Holdfast.apk 2>&1 | grep -v "savepack\|Storing File" | tail -40
          test -s build/web/Holdfast.apk
          echo "Android app: Holdfast.apk ($(du -h build/web/Holdfast.apk | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # The same game for Windows: one .exe with the game packed inside, zipped, published next to the web build as
      # Holdfast_windows.zip. (If this step fails the web build still goes out.)
      - name: Export Windows program
        continue-on-error: true
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --export-release "Windows Desktop" build/windows/Holdfast.exe 2>&1 | grep -v "savepack\|Storing File" | tail -20
          test -s build/windows/Holdfast.exe
          (cd build/windows && zip -q -9 ../web/Holdfast_windows.zip Holdfast.exe)
          echo "Windows program: Holdfast_windows.zip ($(du -h build/web/Holdfast_windows.zip | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
